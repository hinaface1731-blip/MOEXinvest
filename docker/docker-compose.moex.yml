name: moexinvest
services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "main.py", "--serve-only", "--host", "0.0.0.0", "--port", "${API_PORT:-8000}"]
    env_file: ../.env
    environment:
      TZ: Europe/Moscow
      ADMIN_AUTH_ENABLED: 'true'
    ports:
      - '127.0.0.1:${API_PORT:-8000}:${API_PORT:-8000}'
    volumes:
      - ../data:/app/data
      - ../reports:/app/reports
      - ../logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${API_PORT:-8000}/api/health >/dev/null"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
  telegram:
    profiles: [telegram]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "bot.platforms.moex_telegram"]
    env_file: ../.env
    environment:
      TZ: Europe/Moscow
    volumes:
      - ../data:/app/data
      - ../reports:/app/reports
    restart: unless-stopped
